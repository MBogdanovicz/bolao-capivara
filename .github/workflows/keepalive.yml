name: Keep Supabase active

# Supabase's free plan pauses projects after 7 days without activity. During the
# season the sync job keeps the project active; between seasons this weekly
# query keeps it from being paused.
on:
  schedule:
    - cron: '0 12 * * 1' # every Monday, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/competitions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
